</style></head><body><div id="shell"><canvas id="game"></canvas><div class="hud"><div class="title">NEON LAST STAND · MOBILE</div><div class="score" id="score">0 · WAVE 1</div></div><div class="bars"><div class="bar"><i class="hp" id="hp"></i></div><div class="bar"><i class="xp" id="xp"></i></div></div><div class="controls"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="aim" id="aim"><div class="aim-label">AIM + FIRE</div><div class="fire" id="fire">AIM</div></div></div><div class="cover" id="cover"><div class="card" id="card"></div></div><div class="splash" id="splash"><div><h1>NEON<br>LAST STAND</h1><p>MOBILE EDITION</p></div></div></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),cover=document.querySelector('#cover'),card=document.querySelector('#card'),hpEl=document.querySelector('#hp'),xpEl=document.querySelector('#xp'),scoreEl=document.querySelector('#score'),stick=document.querySelector('#stick'),nub=document.querySelector('#nub'),aim=document.querySelector('#aim'),fireEl=document.querySelector('#fire');let W,H,dpr,run=false,p,enemies=[],shots=[],gems=[],bits=[],stars=[],t0=0,spawn=0,waveTime=0,score=0,wave=1,move={x:0,y:0},aimDir={x:1,y:0},firing=false,levelChoices=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth<innerHeight?innerHeight:innerWidth;H=innerWidth<innerHeight?innerWidth:innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.ceil(W*H/4200)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.25,a:Math.random()}))}addEventListener('resize',resize);resize();
function menu(){cover.classList.remove('hidden');card.innerHTML='<h1>NEON<br>LAST STAND</h1><p>A landscape twin-stick survival arena. Move with the left stick. Push the right stick in any direction to aim and fire.</p><button id="start">START MISSION</button>';document.querySelector('#start').onclick=start}function start(){screen.orientation?.lock?.('landscape').catch(()=>{});p={x:W*.5,y:H*.5,r:15,hp:100,max:100,xp:0,next:42,lvl:1,spd:136.67,damage:2,fire:0,rate:.19,magnet:100,pierce:0};enemies=[];shots=[];gems=[];bits=[];score=0;wave=1;spawn=.5;waveTime=0;run=true;cover.classList.add('hidden')}
function burst(X,Y,col,n=8,pow=110){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=Math.random()*pow;bits.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.35,max:.6,col,r:1+Math.random()*3})}}
function makeEnemy(){let a=Math.random()*6.28,d=Math.max(W,H)*.7+80,kind=Math.random()<Math.min(.28,wave*.025)?1:0;enemies.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:kind?23:14,hp:kind?12:4,max:kind?12:4,spd:kind?23.33:38.67,rot:Math.random()*6.28,spin:(Math.random()-.5)*2.4,kind})}
function shoot(){let a=Math.atan2(aimDir.y,aimDir.x),spread=p.multi?[-.13,0,.13]:[0];for(const q of spread)shots.push({x:p.x+Math.cos(a)*19,y:p.y+Math.sin(a)*19,vx:Math.cos(a+q)*520,vy:Math.sin(a+q)*520,life:1,d:p.damage,pierce:p.pierce});p.fire=p.rate;burst(p.x+aimDir.x*16,p.y+aimDir.y*16,'#b6faff',3,60);sfx('shot')}
function choose(){run=false;let pool=[['OVERCHARGE','Shots deal +1 damage',()=>p.damage++],['REPAIR KIT','Restore 40 health',()=>p.hp=Math.min(p.max,p.hp+40)],['VITAL CORE','+25 maximum health and heal',()=>{p.max+=25;p.hp=Math.min(p.max,p.hp+25)}],['QUICK TRIGGER','Fire 20% faster',()=>p.rate*=.8],['THRUSTERS','Move 16% faster',()=>p.spd*=1.16],['TRIPLE SHOT','Fire three rounds together',()=>p.multi=true],['MAGNET FIELD','Collect crystals from farther away',()=>p.magnet+=55],['PIERCING AMMO','Rounds pass through +1 asteroid',()=>p.pierce++]];levelChoices=[];while(levelChoices.length<3)levelChoices.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);cover.classList.remove('hidden');card.innerHTML='<h1>LEVEL '+p.lvl+'</h1><p>Choose your next upgrade</p><div class="upgrade-grid">'+levelChoices.map((u,i)=>'<button data-i="'+i+'"><b>'+u[0]+'</b><br>'+u[1]+'</button>').join('')+'</div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{levelChoices[+b.dataset.i][2]();run=true;cover.classList.add('hidden')})}
function update(dt){if(!run)return;p.x=Math.max(p.r,Math.min(W-p.r,p.x+move.x*p.spd*dt));p.y=Math.max(p.r,Math.min(H-p.r,p.y+move.y*p.spd*dt));p.fire-=dt;if(firing&&p.fire<=0)shoot();spawn-=dt;waveTime+=dt;if(spawn<0){makeEnemy();spawn=Math.max(.2,.72-wave*.025)}if(waveTime>27){wave++;waveTime=0;burst(p.x,p.y,'#ffe97c',20,170)}for(const e of enemies){let dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt;e.rot+=e.spin*dt;if(l<e.r+p.r&&p.inv<=0){p.hp-=e.kind?16:9;p.inv=.6;burst(p.x,p.y,'#ff6079',15,160)}}p.inv=Math.max(0,(p.inv||0)-dt);for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(const e of enemies){if(!e.dead&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+4){e.hp-=s.d;e.hit=.12;s.pierce--;burst(s.x,s.y,'#e0ffff',5,90);if(e.hp<=0){e.dead=true;score+=e.kind?5:2;gems.push({x:e.x,y:e.y,v:e.kind?5:2});burst(e.x,e.y,e.kind?'#a3877f':'#8793ab',16,150)}if(s.pierce<0)s.life=0;break}}}shots=shots.filter(s=>s.life>0);enemies=enemies.filter(e=>!e.dead);for(const q of gems){let dx=p.x-q.x,dy=p.y-q.y,l=Math.hypot(dx,dy)||1;if(l<p.magnet){q.x+=dx/l*300*dt;q.y+=dy/l*300*dt}if(l<24){q.dead=true;p.xp+=q.v;burst(q.x,q.y,'#5deeff',6,80)}}gems=gems.filter(q=>!q.dead);if(p.xp>=p.next){p.xp-=p.next;p.lvl++;p.next=Math.floor(p.next*1.75);choose()}for(const b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.91;b.vy*=.91;b.life-=dt}bits=bits.filter(b=>b.life>0);if(p.hp<=0){run=false;cover.classList.remove('hidden');card.innerHTML='<h1>MISSION<br>OVER</h1><p>Score <b>'+score+'</b> · Reached wave <b>'+wave+'</b></p><button id="start">TRY AGAIN</button>';document.querySelector('#start').onclick=start}hpEl.style.width=Math.max(0,p.hp/p.max*100)+'%';xpEl.style.width=p.xp/p.next*100+'%';scoreEl.textContent=score+' · WAVE '+wave}
function poly(e){x.save();x.translate(e.x,e.y);x.rotate(e.rot);x.fillStyle=e.hit>0?'#fff':e.kind?'#9a6c68':'#61738a';x.shadowBlur=15;x.shadowColor=x.fillStyle;x.beginPath();for(let i=0;i<9;i++){let a=i*6.283/9,r=e.r*(.78+.17*Math.sin(i*4+e.rot));i?x.lineTo(Math.cos(a)*r,Math.sin(a)*r):x.moveTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.shadowBlur=0;x.fillStyle='#29314388';x.beginPath();x.arc(-e.r*.2,-e.r*.15,e.r*.23,0,6.28);x.fill();x.restore()}
function render(){x.clearRect(0,0,W,H);let bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0b1330');bg.addColorStop(1,'#070918');x.fillStyle=bg;x.fillRect(0,0,W,H);for(const s of stars){x.globalAlpha=.2+s.a*.65;x.fillStyle='#d4ebff';x.fillRect(s.x,s.y,s.r,s.r)}x.globalAlpha=1;let n=x.createRadialGradient(W*.15,H*.18,0,W*.15,H*.18,Math.max(W,H)*.6);n.addColorStop(0,'#6430a526');n.addColorStop(1,'transparent');x.fillStyle=n;x.fillRect(0,0,W,H);for(const b of bits){x.globalAlpha=b.life/b.max;x.fillStyle=b.col;x.beginPath();x.arc(b.x,b.y,b.r,0,6.28);x.fill()}x.globalAlpha=1;for(const q of gems){x.fillStyle='#5eeeff';x.shadowBlur=13;x.shadowColor='#50eaff';x.beginPath();x.arc(q.x,q.y,6,0,6.28);x.fill()}for(const s of shots){x.fillStyle='#d9feff';x.shadowBlur=12;x.shadowColor='#5feeff';x.beginPath();x.arc(s.x,s.y,3.5,0,6.28);x.fill()}x.shadowBlur=0;for(const e of enemies){poly(e);x.fillStyle='#1b2137';x.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,3);x.fillStyle='#78f3e9';x.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*e.hp/e.max,3)}x.save();x.translate(p?.x||W/2,p?.y||H/2);x.shadowBlur=20;x.shadowColor='#4ad8ff';/* upright survivor body */x.fillStyle='#192845';x.fillRect(-11,7,8,14);x.fillRect(3,7,8,14);x.fillStyle='#0d162a';x.fillRect(-12,19,10,4);x.fillRect(3,19,10,4);x.fillStyle=p?.inv>0?'#fff':'#2cc8f5';x.fillRect(-12,-10,24,20);x.fillStyle='#1b4b75';x.fillRect(-12,-10,5,20);x.fillStyle='#b5f6ff';x.fillRect(-2,-9,4,18);x.shadowBlur=0;x.fillStyle='#e5aa82';x.beginPath();x.arc(-1,-18,10,0,6.28);x.fill();x.fillStyle='#17233c';x.beginPath();x.arc(-2,-21,10,Math.PI,6.28);x.fill();x.fillStyle='#72efff';x.fillRect(2,-20,9,4);/* only the aiming arm and blaster turn */x.save();x.rotate(Math.atan2(aimDir.y,aimDir.x));x.fillStyle='#d89e79';x.fillRect(5,-4,14,8);x.fillStyle='#a8f8ff';x.fillRect(17,-7,23,10);x.fillStyle='#35496d';x.fillRect(34,-4,9,4);x.restore();x.restore();x.shadowBlur=0}
function loop(now){let dt=Math.min(.035,(now-t0)/1000||.016);t0=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);setTimeout(()=>{document.querySelector('#splash').classList.add('hidden');menu()},3000);
let audio;function unlockAudio(){try{audio??=new (AudioContext||webkitAudioContext)();audio.resume()}catch{}}function sfx(kind){if(!audio||audio.state!=='running')return;let cfg={shot:[520,.05,'square',.025,290],kill:[180,.11,'triangle',.04,85],hurt:[120,.16,'sawtooth',.05,65],level:[420,.24,'sine',.05,900]}[kind];if(!cfg)return;let now=audio.currentTime,o=audio.createOscillator(),v=audio.createGain();o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],now);o.frequency.exponentialRampToValueAtTime(cfg[4],now+cfg[1]);v.gain.setValueAtTime(cfg[3],now);v.gain.exponentialRampToValueAtTime(.001,now+cfg[1]);o.connect(v).connect(audio.destination);o.start(now);o.stop(now+cfg[1])}function setMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy)||1,m=Math.min(30,l);move={x:dx/l*m/30,y:dy/l*m/30};nub.style.transform='translate('+dx/l*m+'px,'+dy/l*m+'px)'}let stickId=null;stick.addEventListener('pointerdown',e=>{unlockAudio();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);setMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setMove(e)});function releaseStick(e){if(e.pointerId===stickId){stickId=null;move={x:0,y:0};nub.style.transform=''}}stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);let aimId=null;function setAim(e){let r=aim.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy)||1,m=Math.min(30,l);aimDir={x:dx/l,y:dy/l};fireEl.style.transform='translate('+dx/l*m+'px,'+dy/l*m+'px)';firing=l>10;fireEl.classList.toggle('on',firing)}aim.addEventListener('pointerdown',e=>{unlockAudio();if(!run)return;aimId=e.pointerId;aim.setPointerCapture(e.pointerId);setAim(e)});aim.addEventListener('pointermove',e=>{if(e.pointerId===aimId)setAim(e)});function releaseAim(e){if(e.pointerId===aimId){aimId=null;firing=false;fireEl.classList.remove('on');fireEl.style.transform=''}}aim.addEventListener('pointerup',releaseAim);aim.addEventListener('pointercancel',releaseAim);if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./neon-last-stand-mobile-sw.js'));const gameUpdate=update;update=function(dt){let enemyCount=enemies.length,health=p?.hp,level=p?.lvl;gameUpdate(dt);if(enemies.length<enemyCount)sfx('kill');if(p&&p.hp<health)sfx('hurt');if(p&&p.lvl>level)sfx('level')};
